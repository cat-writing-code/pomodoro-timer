<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pomodoro Timer</title>

        <link rel="stylesheet" href="css/style.css">
    </head>

    <body align="center" style="background-color: #984343;">

        <div class="title">
            <h1>Pomodoro Timer</h1>
        </div>

        <div class="status">
            <h2>Work/Short Break/Long Break</h2>
        </div>

        <div class="timer">
            <h2>XX:XX</h2>
        </div>

        <div class="icon">
            <img src="assets/icons/bg.png">
        </div>

        <div class="timer-controls">
            <button id="startButt">Start</button>
            <button id="pauseButt">Pause</button>
            <button id="stopButt">Stop</button>
            <button id="resetButt">Reset</button>
        </div>

        <script src="js/Timer.js"></script>
        <script src="js/Pomodoro.js"></script>
    </body>
</html>
